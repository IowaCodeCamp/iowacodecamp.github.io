<router-outlet></router-outlet>
<app-header></app-header>
<app-shell [pageTitle]="year + ' Speakers'">
  <ng-container *ngIf="showSpeakers; else pending">
    <div class="max-w-640 mx-auto mb-60 prose">
      <p>
        <!-- A variety of speakers, from just starting out to well-known, professional speakers from around the midwest. -->
        <!-- If you're interested in speaking at Iowa Code Camp, please <a class="a text-orange"
          href="https://sessionize.com/iowa-code-camp-fall-2024/" target="_blank">submit a session</a>! -->
      </p>
    </div>
    <div class="max-w-1024 mx-auto">
      <ng-template
        [ngIf]="speakers.length > 0"
        [ngIfElse]="noSpeakers"
      >
        <ul>
          <ng-container *ngFor="let speaker of speakers">
            <li class="mb-60">
              <app-speaker [speaker]="speaker"></app-speaker>
            </li>
          </ng-container>
        </ul>
      </ng-template>
      <ng-template #noSpeakers>
        <p class="text-center">
          No Speakers found.
        </p>
      </ng-template>
    </div>
  </ng-container>
  <ng-template #pending>
    <div class="max-w-640 mx-auto mb-60 prose text-center">
      <p>
        Check back soon for the {{ year }} speakers!
      </p>
    </div>
  </ng-template>
</app-shell>
<app-footer></app-footer>

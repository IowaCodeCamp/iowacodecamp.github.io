<ng-container *ngIf="session">
  <app-modal-shell>
    <div role="dialog" aria-modal="true" [attr.aria-labelledby]="id + '-title'">
      <div class="flex items-start gap-16 p-16 border-b-2 border-gray-light">
        <div class="flex-1">
          <p class="text-12 uppercase tracking-1 mb-4">
            {{ session.startsAt | date:'h:mm' }}&ndash;{{ session.endsAt | date:'h:mm a' }}
            <ng-container *ngIf="roomName">&middot; {{ roomName }}</ng-container>
          </p>
          <h2 [id]="id + '-title'" class="h4 text-red leading-tight">{{ session.title }}</h2>
        </div>
        <button
          #closeButton
          type="button"
          class="shrink-0 w-40 h-40 flex items-center justify-center text-24 leading-none hover:text-red"
          (click)="close()"
        >
          <span aria-hidden="true">&times;</span>
          <span class="sr-only">Close</span>
        </button>
      </div>
      <app-modal-body>
        <div class="p-16">
          <p *ngIf="session.description" class="whitespace-pre-line">{{ session.description }}</p>
          <ul *ngIf="speakers.length > 0" class="pt-16 flex flex-col gap-16">
            <li *ngFor="let speaker of speakers" class="flex items-center gap-12">
              <img
                class="w-48 h-48 shrink-0 aspect-square object-cover rounded-full"
                [src]="speaker.profilePicture || '/assets/images/persona.png'"
                alt=""
              />
              <div>
                <p class="h5 text-orange">{{ speaker.firstName }} {{ speaker.lastName }}</p>
                <p *ngIf="speaker.tagLine" class="text-12">{{ speaker.tagLine }}</p>
              </div>
            </li>
          </ul>
        </div>
      </app-modal-body>
    </div>
  </app-modal-shell>
</ng-container>

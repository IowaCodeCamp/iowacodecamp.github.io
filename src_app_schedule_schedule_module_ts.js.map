<router-outlet></router-outlet>
<app-header></app-header>
<app-shell [pageTitle]="year + ' Schedule'">
  <ng-container *ngIf="showSchedule; else pending">
    <div class="max-w-640 mx-auto mb-60">
      <div class="prose">
        <p>
          Drop by the sponsor booths between sessions to win prizes and meet some pretty awesome supporters!
        </p>
      </div>
    </div>
    <div class="max-w-1280 mx-auto mb-24 flex justify-center">
      <div class="inline-flex border-2 border-red" role="group" aria-label="Schedule view">
        <button
          type="button"
          class="px-16 py-8 font-bold uppercase tracking-1 text-12"
          [ngClass]="view === 'glance' ? 'bg-red text-white' : 'bg-white text-red'"
          [attr.aria-pressed]="view === 'glance'"
          (click)="setView('glance')"
        >
          At a glance
        </button>
        <button
          type="button"
          class="px-16 py-8 font-bold uppercase tracking-1 text-12"
          [ngClass]="view === 'detailed' ? 'bg-red text-white' : 'bg-white text-red'"
          [attr.aria-pressed]="view === 'detailed'"
          (click)="setView('detailed')"
        >
          Detailed
        </button>
      </div>
    </div>
    <ng-container *ngIf="view === 'glance'; else detailed">
      <div class="max-w-1280 mx-auto mb-60">
        <app-agenda-grid [data]="allSessionizeData"></app-agenda-grid>
      </div>
    </ng-container>
    <ng-template #detailed>
      <div class="max-w-1024 mx-auto mb-60">
        <ul>
          <ng-container *ngFor="let group of sessionGroups | keyvalue">
            <li class="mb-32">
                <app-time-block
                  [sessions]="group.value"
                >
                </app-time-block>
            </li>
          </ng-container>
        </ul>
      </div>
    </ng-template>
  </ng-container>
  <ng-template #pending>
    <div class="max-w-640 mx-auto mb-60 prose text-center">
      <p>
        Check back soon for the {{ year }} schedule!
      </p>
    </div>
  </ng-template>
</app-shell>
<app-footer></app-footer>
